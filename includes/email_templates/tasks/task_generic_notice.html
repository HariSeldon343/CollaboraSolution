<p style="margin:0 0 12px 0;">Ciao <strong>{{USER_NAME}}</strong>,</p>

<div style="margin:12px 0 0 0;padding:12px;border:1px solid #eef0f3;border-radius:8px;color:#374151;background:#ffffff;">
  <div style="white-space:pre-line;">{{MESSAGE}}</div>
  {{#TASK_TITLE}}<div style="margin-top:10px;color:#111827;"><strong>Task:</strong> {{TASK_TITLE}}</div>{{/TASK_TITLE}}
</div>

{{#TASK_URL}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:18px 0;">
  <tr>
    <td>
      <a href="{{TASK_URL}}" style="display:inline-block;background:#1a2332;color:#ffffff;text-decoration:none;padding:12px 16px;border-radius:8px;font-weight:600;font-size:14px;line-height:18px;">Apri task</a>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:12px;line-height:18px;color:#6b7280;">
  Link diretto: <a href="{{TASK_URL}}" style="color:#1a2332;text-decoration:none;word-break:break-all;">{{TASK_URL}}</a>
</p>
{{/TASK_URL}}
